<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <title>Wishlist</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <script
    src="/app.js"
    defer
  ></script>
</head>

<body>
  <div
    class="background-glow"
  ></div>

  <main class="page">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">
            AMAZON WISHLIST
          </p>

          <h1>
            Things I want.
          </h1>
        </div>

        <div
          class="item-count"
          id="status"
          aria-live="polite"
        >
          Loading
        </div>
      </div>

      <p class="intro">
        A collection of things saved from Amazon.
      </p>
    </header>

    <nav
      id="filters"
      class="filters"
      aria-label="Wishlist filters"
    ></nav>

    <section
      class="content"
      aria-labelledby="items-heading"
    >
      <div class="section-header">
        <h2 id="items-heading">
          Wishlist
        </h2>

        <span
          id="active-list"
          class="active-list"
        >
          All
        </span>
      </div>

      <div
        id="items"
        class="items"
        aria-live="polite"
      ></div>
    </section>

    <footer class="footer">
      Synced with Amazon
    </footer>
  </main>
</body>
</html>
